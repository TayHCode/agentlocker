name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify runtimes
        run: python .github/ci.py runtime
      - name: Isolate home, temporary files and crontab
        run: python .github/ci.py setup
      - name: Install pinned test dependencies
        run: python -m pip install --target .scratch/ci/deps Pillow==13.0.0 tzdata==2026.5
      - name: Unit tests and UI smokes (reject unexpected skips)
        run: python .github/ci.py tests
      - name: Hub check
        run: python hub.py check

  remote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: remote
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify runtimes
        working-directory: ${{ github.workspace }}
        run: python .github/ci.py runtime
      - name: Isolate home, temporary files and crontab
        working-directory: ${{ github.workspace }}
        run: python .github/ci.py setup
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
